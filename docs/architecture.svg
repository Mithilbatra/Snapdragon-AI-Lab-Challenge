<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#0d1117"/>
  <text x="32" y="46" fill="#e6edf3" font-size="26" font-weight="700">Snap<tspan fill="#3fb6b2">Assist</tspan> — on-device architecture</text>
  <text x="32" y="72" fill="#8b949e" font-size="14">Private, offline meeting assistant · all inference on the Snapdragon Hexagon NPU</text>

  <!-- App layer -->
  <rect x="32" y="100" width="896" height="120" rx="12" fill="#161b22" stroke="#2a3140"/>
  <text x="52" y="126" fill="#8b949e" font-size="12" letter-spacing="1">FLAGSHIP APP  ·  SnapAssist</text>
  <g>
    <rect x="52" y="140" width="180" height="60" rx="8" fill="#1c2333" stroke="#2a3140"/>
    <text x="142" y="167" fill="#e6edf3" font-size="13" text-anchor="middle">Web UI (offline)</text>
    <text x="142" y="185" fill="#8b949e" font-size="11" text-anchor="middle">record · transcript · notes</text>

    <rect x="252" y="140" width="180" height="60" rx="8" fill="#1c2333" stroke="#2a3140"/>
    <text x="342" y="167" fill="#e6edf3" font-size="13" text-anchor="middle">FastAPI server</text>
    <text x="342" y="185" fill="#8b949e" font-size="11" text-anchor="middle">localhost only</text>

    <rect x="452" y="140" width="180" height="60" rx="8" fill="#1c2333" stroke="#2a3140"/>
    <text x="542" y="167" fill="#e6edf3" font-size="13" text-anchor="middle">Meeting pipeline</text>
    <text x="542" y="185" fill="#8b949e" font-size="11" text-anchor="middle">ASR → LLM → TTS</text>

    <rect x="652" y="140" width="256" height="60" rx="8" fill="#1c2333" stroke="#2a3140"/>
    <text x="780" y="167" fill="#e6edf3" font-size="13" text-anchor="middle">Local SQLite history</text>
    <text x="780" y="185" fill="#8b949e" font-size="11" text-anchor="middle">never leaves the device</text>
  </g>

  <!-- arrow down -->
  <path d="M480 220 L480 250" stroke="#3fb6b2" stroke-width="2" marker-end="url(#a)"/>

  <!-- Core layer -->
  <rect x="32" y="260" width="896" height="120" rx="12" fill="#161b22" stroke="#1d3b3a"/>
  <text x="52" y="286" fill="#3fb6b2" font-size="12" letter-spacing="1">REUSABLE CORE  ·  edge_infer  (open source)</text>
  <g>
    <rect x="52" y="300" width="270" height="60" rx="8" fill="#132a2a" stroke="#1d3b3a"/>
    <text x="187" y="327" fill="#e6edf3" font-size="13" text-anchor="middle">EdgeSession</text>
    <text x="187" y="345" fill="#8b949e" font-size="11" text-anchor="middle">ONNX Runtime + QNN EP · CPU fallback</text>

    <rect x="342" y="300" width="270" height="60" rx="8" fill="#132a2a" stroke="#1d3b3a"/>
    <text x="477" y="327" fill="#e6edf3" font-size="13" text-anchor="middle">Genie runtime</text>
    <text x="477" y="345" fill="#8b949e" font-size="11" text-anchor="middle">on-device LLM generation</text>

    <rect x="632" y="300" width="276" height="60" rx="8" fill="#132a2a" stroke="#1d3b3a"/>
    <text x="770" y="327" fill="#e6edf3" font-size="13" text-anchor="middle">Benchmark harness</text>
    <text x="770" y="345" fill="#8b949e" font-size="11" text-anchor="middle">NPU vs CPU latency / throughput</text>
  </g>

  <!-- arrow down -->
  <path d="M480 380 L480 410" stroke="#3fb6b2" stroke-width="2" marker-end="url(#a)"/>

  <!-- Models + hardware -->
  <rect x="32" y="420" width="896" height="72" rx="12" fill="#161b22" stroke="#2a3140"/>
  <text x="52" y="446" fill="#8b949e" font-size="12" letter-spacing="1">QUALCOMM AI HUB MODELS  →  HEXAGON NPU (80–85 TOPS)</text>
  <g font-size="12" fill="#e6edf3">
    <rect x="52" y="456" width="150" height="26" rx="13" fill="#1c2333" stroke="#2a3140"/><text x="127" y="473" text-anchor="middle">Whisper · ASR</text>
    <rect x="212" y="456" width="220" height="26" rx="13" fill="#1c2333" stroke="#2a3140"/><text x="322" y="473" text-anchor="middle">Phi-3.5 / Llama-3.2 · LLM</text>
    <rect x="442" y="456" width="150" height="26" rx="13" fill="#1c2333" stroke="#2a3140"/><text x="517" y="473" text-anchor="middle">MeloTTS · TTS</text>
    <rect x="602" y="456" width="150" height="26" rx="13" fill="#1c2333" stroke="#2a3140"/><text x="677" y="473" text-anchor="middle">TrOCR · OCR (opt)</text>
  </g>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb6b2"/>
    </marker>
  </defs>
</svg>
